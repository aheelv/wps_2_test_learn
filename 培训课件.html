<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-content-type" content="presentation">
<meta name="x-presentation-version" content="1.0">
<meta name="x-presentation-indicator" content="deck-stage .slide">
<title>培训课件 · 大连财经学院 计算机国家二级考试（WPS 类）培训</title>
<meta name="description" content="大连财经学院计算机国家二级考试（WPS 类）校内教学辅助资料：44 课时培训课件。依据 NCRE 二级 WPS Office 高级应用与设计考试大纲（2025 年版）编写，本站为非官方考试网站，不提供报名、缴费、查分服务，不收集任何个人信息。">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f2740; --ink2:#33475f; --muted:#6b7a90; --line:#e3e9f1;
  --brand:#16324f; --brand2:#1f4a75; --accent:#e8503a; --gold:#f2a33c;
  --ok:#16a34a;
  --bg:#eef2f7;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Cascadia Code",monospace;
}
html,body{height:100%}
body{background:#0b1a2b;font-family:var(--sans);color:var(--ink);overflow:hidden}

/* ---------- 舞台 ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(1200px 700px at 20% 0%,#14304d,transparent 60%),
  radial-gradient(1000px 700px at 90% 100%,#1a2f4a,transparent 55%),#0b1a2b}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{
  position:absolute;inset:0;background:#fff;border-radius:6px;overflow:hidden;
  opacity:0;visibility:hidden;transition:opacity .32s ease;display:flex;flex-direction:column;
}
.slide.active{opacity:1;visibility:visible}

/* ---------- 顶部/底部 ---------- */
.s-head{display:flex;align-items:center;gap:14px;padding:26px 56px 0}
.s-head .modtag{font-size:14px;font-weight:800;letter-spacing:.06em;padding:5px 13px;border-radius:99px;color:#fff;background:var(--mc,var(--brand))}
.s-head .lno{font-size:14px;font-weight:700;color:var(--muted)}
.s-body{flex:1;padding:22px 56px 30px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.s-foot{position:absolute;left:56px;right:56px;bottom:18px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
h2.s-title{font-size:44px;font-weight:900;letter-spacing:-.5px;line-height:1.15;margin-bottom:8px;color:var(--ink)}
.s-sub{font-size:19px;color:var(--muted);font-weight:600;margin-bottom:26px}
.rule{height:6px;width:78px;border-radius:99px;background:linear-gradient(90deg,var(--mc,var(--accent)),var(--gold));margin-bottom:26px}

/* 列表 */
ul.b{list-style:none;display:flex;flex-direction:column;gap:15px}
ul.b li{position:relative;padding-left:40px;font-size:25px;line-height:1.5;color:var(--ink2)}
ul.b li::before{content:"";position:absolute;left:8px;top:.52em;width:13px;height:13px;border-radius:4px;background:var(--mc,var(--accent));transform:rotate(45deg)}
ul.b li b{color:var(--ink);font-weight:800}
ul.b li code{font-family:var(--mono);background:#eef3f9;color:#0d4d7a;padding:.06em .4em;border-radius:6px;font-size:.86em}

/* 封面 */
.cover{background:linear-gradient(150deg,#0d2036 0%,#16324f 48%,#1d4368 100%);color:#fff;justify-content:center;align-items:flex-start;padding:0 96px}
.cover::after{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:40px 40px;mask-image:radial-gradient(75% 75% at 60% 40%,#000 35%,transparent 100%)}
.cover .eyebrow{position:relative;z-index:2;font-size:15px;font-weight:800;letter-spacing:.24em;color:var(--gold);margin-bottom:22px}
.cover h1{position:relative;z-index:2;font-size:58px;font-weight:900;line-height:1.14;letter-spacing:-1px;max-width:960px}
.cover .lead{position:relative;z-index:2;font-size:22px;color:#bcd4ec;margin-top:24px;max-width:900px;line-height:1.6}
.cover .stats{position:relative;z-index:2;display:flex;gap:16px;margin-top:40px}
.cover .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:16px 24px;backdrop-filter:blur(6px)}
.cover .stat b{display:block;font-size:34px;color:#fff;line-height:1.05}
.cover .stat span{font-size:13.5px;color:#a9c6e2}
.cover .badge-line{position:relative;z-index:2;margin-top:30px;font-size:15px;color:#9fbcd8}

/* 概览/目录 */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px}
.ov-card{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fbfcfe;border-top:5px solid var(--mc,#16324f);position:relative}
.ov-card .n{font-size:13px;font-weight:900;color:var(--mc);letter-spacing:.06em}
.ov-card h3{font-size:21px;font-weight:800;margin:6px 0 8px;color:var(--ink);line-height:1.3}
.ov-card p{font-size:14px;color:var(--muted);line-height:1.55}
.ov-card .hrs{margin-top:12px;font-size:13.5px;font-weight:800;color:var(--mc)}
.ov-grid.s11{grid-template-columns:repeat(4,1fr);gap:12px;margin-top:4px}
.ov-grid.s11 .ov-card{padding:12px 14px;border-top-width:4px;border-radius:11px}
.ov-grid.s11 .ov-card .n{font-size:11.5px}
.ov-grid.s11 .ov-card h3{font-size:15.5px;margin:4px 0 5px;line-height:1.28}
.ov-grid.s11 .ov-card p{font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov-grid.s11 .ov-card .hrs{margin-top:7px;font-size:11.5px}
.score-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.score-strip .sc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;text-align:center}
.score-strip .sc b{display:block;font-size:30px;color:var(--accent);font-weight:900}
.score-strip .sc span{font-size:12.5px;color:var(--muted);font-weight:600}

/* 章节分隔 */
.divider{background:linear-gradient(140deg,#0d2036,#16324f 55%,#1c3f63);color:#fff;justify-content:center;padding:0 96px}
.divider::after{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:radial-gradient(700px 400px at 85% 20%,rgba(232,80,58,.35),transparent 60%)}
.divider .modno{position:relative;z-index:2;font-size:150px;font-weight:900;line-height:.9;color:rgba(255,255,255,.14);letter-spacing:-4px}
.divider h2{position:relative;z-index:2;font-size:54px;font-weight:900;color:#fff;margin:8px 0 16px;letter-spacing:-.5px}
.divider .dsub{position:relative;z-index:2;font-size:20px;color:#bcd4ec;max-width:820px;line-height:1.6}
.divider .dmeta{position:relative;z-index:2;margin-top:30px;display:flex;gap:14px;flex-wrap:wrap}
.divider .dmeta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 18px;font-size:15px;color:#e3eefb;font-weight:700}

/* 次课分隔 */
.session{background:linear-gradient(140deg,#0d2036,#16324f 55%,#1c3f63);color:#fff;justify-content:center;padding:0 96px}
.session::after{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:radial-gradient(700px 400px at 85% 20%,rgba(232,80,58,.35),transparent 60%)}
.session .sno{position:relative;z-index:2;font-size:17px;font-weight:900;letter-spacing:.2em;color:var(--gold)}
.session h2{position:relative;z-index:2;font-size:50px;font-weight:900;color:#fff;margin:10px 0 14px;letter-spacing:-.5px}
.session .theme{position:relative;z-index:2;font-size:18px;color:#bcd4ec;max-width:900px;line-height:1.6}
.session .dmeta{position:relative;z-index:2;margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.session .dmeta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:7px 16px;font-size:14px;color:#e3eefb;font-weight:700}
.session .ratio{position:relative;z-index:2;margin-top:20px;display:flex;height:32px;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.25);max-width:720px}
.session .ratio i{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;font-style:normal}
.session .ratio .t{width:40%;background:rgba(255,255,255,.22);color:#fff}
.session .ratio .p{width:60%;background:linear-gradient(90deg,#f2a33c,#e8503a);color:#fff}
.session .goals{position:relative;z-index:2;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;max-width:1040px}
.session .goals div{position:relative;padding-left:22px;font-size:16px;color:#dbe8f5;line-height:1.5}
.session .goals div::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;border-radius:3px;background:var(--gold);transform:rotate(45deg)}
.session .focusline{position:relative;z-index:2;margin-top:16px;font-size:16px;color:#ffd79a;font-weight:700;max-width:1040px;line-height:1.55}
.session .focusline b{color:#fff;font-weight:900}

/* 课时页 */
.lesson .s-head{justify-content:flex-start}
.lobj{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px}
.lpanel{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:#fbfcfe}
.lpanel.k{border-left:5px solid var(--mc,var(--accent))}
.lpanel.d{border-left:5px solid var(--gold)}
.lpanel h4{font-size:15px;font-weight:900;color:var(--muted);letter-spacing:.08em;margin-bottom:12px;text-transform:uppercase}
.lpanel ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.lpanel li{position:relative;padding-left:20px;font-size:17.5px;line-height:1.5;color:var(--ink2)}
.lpanel li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--accent))}
.lpanel.d li::before{background:var(--gold)}
.lesson .huge{font-size:40px;font-weight:900;line-height:1.18;color:var(--ink);max-width:1000px}
.lesson .meta-row{display:flex;gap:12px;margin-top:18px}

/* 课堂练习安排 */
.pintro .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.pintro .pc{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fbfcfe;text-align:center}
.pintro .pc b{display:block;font-size:38px;font-weight:900;color:var(--mc,var(--accent));line-height:1.05}
.pintro .pc span{font-size:13.5px;color:var(--muted);font-weight:700}
.pintro .tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.pintro .tags span{background:#eef3f9;color:#0d4d7a;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700}
.pintro .note{margin-top:20px;border-left:5px solid var(--gold);background:#fff8ec;border-radius:0 10px 10px 0;padding:14px 18px;font-size:15.5px;color:#7a4a09;line-height:1.6}

/* 选择题 */
.quiz .qitem{border:1px solid var(--line);border-radius:13px;padding:14px 20px;background:#fbfcfe;margin-bottom:12px}
.quiz .qitem .qh{font-size:19px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:10px}
.quiz .qitem .qh i{color:var(--mc,var(--accent));font-style:normal;font-weight:900;margin-right:8px}
.quiz .qitem .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.quiz .qitem .opts div{font-size:16.5px;color:var(--ink2);line-height:1.5}
.quiz .qitem .opts div b{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:7px;background:#eef3f9;color:#0d4d7a;font-size:13px;margin-right:8px}

/* 答案与解析 */
.qans .aitem{border-left:5px solid var(--ok);background:#f6fbf8;border-radius:0 12px 12px 0;padding:12px 18px;margin-bottom:11px}
.qans .aitem .top{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px}
.qans .aitem .top em{font-style:normal;color:var(--ok);margin-left:8px}
.qans .aitem .top span{font-size:12.5px;color:var(--muted);font-weight:700;margin-left:8px}
.qans .aitem .exp{font-size:15px;color:var(--ink2);line-height:1.6}

/* 操作题 */
.oper .ocols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:4px}
.oper .opanel{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:#fbfcfe}
.oper .opanel h4{font-size:14px;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-bottom:11px;text-transform:uppercase}
.oper .opanel p{font-size:18px;line-height:1.6;color:var(--ink)}
.oper .opanel ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.oper .opanel li{position:relative;padding-left:20px;font-size:16.5px;line-height:1.55;color:var(--ink2)}
.oper .opanel li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--accent))}
.oper .opanel.steps{background:#fff8ec;border-color:#f0d9ae;cursor:pointer}
.oper .opanel.steps h4{color:#a06a12}
.oper .opanel.steps li::before{background:var(--gold)}
.oper .opanel.steps .tip{font-size:13px;color:#a06a12;font-weight:800;margin-bottom:10px}
.oper .opanel.steps ul{transition:filter .2s,opacity .2s}
.oper .opanel.steps.hide ul{filter:blur(7px);opacity:.55;user-select:none}

/* 结尾 */
.end{background:linear-gradient(150deg,#0d2036,#16324f 60%,#1c3f63);color:#fff;justify-content:center;align-items:center;text-align:center}
.end h2{font-size:70px;font-weight:900;color:#fff;letter-spacing:2px}
.end p{font-size:22px;color:#bcd4ec;margin-top:18px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12);z-index:40}
#hud i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2a33c,#e8503a);transition:width .3s}
#ctrl{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:8px;align-items:center}
#ctrl button,#ctrl .cnt{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#dbe8f5;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
#ctrl button:hover{background:rgba(255,255,255,.2)}
#ctrl .cnt{font-variant-numeric:tabular-nums}
#notes{position:fixed;left:0;right:0;bottom:0;background:#0f2740;color:#cfe0f2;border-top:2px solid var(--gold);padding:16px 22px;font-size:14.5px;line-height:1.6;z-index:45;display:none;max-height:34vh;overflow:auto}
#notes.on{display:block}
#notes b{color:var(--gold)}
#orgbar{position:fixed;left:14px;top:12px;z-index:60;font-size:12.5px;font-weight:700;color:#e8f1fa;
  background:rgba(15,39,64,.74);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 13px;
  backdrop-filter:blur(6px);pointer-events:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overview{position:fixed;inset:0;background:#0b1a2b;z-index:70;display:none;overflow:auto;padding:28px}
#overview.on{display:block}
#overview .og-title{color:#fff;font-size:20px;font-weight:800;margin-bottom:16px}
#overview .og{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#overview .oc{background:#14283f;border:1px solid #23405e;border-radius:9px;padding:10px 12px;cursor:pointer;color:#c9dcef}
#overview .oc:hover{background:#1c3a5a}
#overview .oc .t{font-size:12.5px;font-weight:700;line-height:1.35}
#overview .oc .m{font-size:11px;color:#7f9bb8;margin-top:3px}
#overview .oc.sec{background:#1b3a5c;border-color:#2f5b86}
#overview .oc.sec .t{color:#ffd79a}
#overview .oc.pra{background:#20313f;border-color:#3c4d5c}
#overview .oc.pra .t{color:#8fd6b0}

/* 考试说明 */
.exam .scoring{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.exam .sc{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:#fbfcfe;border-top:5px solid var(--accent)}
.exam .sc b{display:block;font-size:36px;font-weight:900;color:var(--accent);line-height:1.05}
.exam .sc .nm{font-size:15px;font-weight:800;color:var(--ink);margin:7px 0 5px}
.exam .sc .dt{font-size:12.5px;color:var(--muted);line-height:1.45}
.exam h3.sec{font-size:19px;font-weight:900;color:var(--ink);margin:22px 0 12px}
.exam .tbar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.exam .tbar i{display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;color:#fff;font-style:normal}
.exam .tplan{display:grid;grid-template-columns:1fr 1fr;gap:7px 30px;margin-top:14px}
.exam .tplan div{font-size:15px;color:var(--ink2);line-height:1.5}
.exam .tplan div b{color:var(--ink)}
.exam .tplan div .m{color:var(--muted)}
.exam .goal{margin-top:16px;border-left:5px solid var(--gold);background:#fff8ec;border-radius:0 10px 10px 0;padding:13px 18px;font-size:16px;color:#7a4a09;line-height:1.6}
.exam .goal b{color:#a06a12}

/* 模块与分值 */
.modules .mtab{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.modules .mhd,.modules .mrow{display:grid;grid-template-columns:3.5fr .9fr 1.4fr 4fr;align-items:center}
.modules .mhd{background:#f2f6fb;border-bottom:1px solid var(--line)}
.modules .mhd>div{padding:9px 16px;font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.modules .mrow{border-top:1px solid var(--line);background:#fbfcfe;border-left:6px solid var(--mc,#16324f)}
.modules .mhd+.mrow{border-top:0}
.modules .mrow>div{padding:13px 16px}
.modules .mrow .mn{font-size:15.5px;font-weight:800;color:var(--ink)}
.modules .mrow .mn em{font-style:normal;color:var(--mc);font-weight:900;margin-right:8px}
.modules .mrow .mn small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.modules .mrow .mh{font-size:18px;font-weight:900;color:var(--mc);text-align:center}
.modules .mrow .ms{font-size:15.5px;font-weight:900;color:var(--accent);text-align:center}
.modules .mrow .my{font-size:12.5px;color:var(--ink2);line-height:1.5}
.modules .mtotal{margin-top:12px;background:#1b3a5a;color:#fff;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700}
.modules .mtotal b{color:var(--gold)}

/* 考纲标注条 */
.exambar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:#eef3f9;border:1px solid #d6e2ef;border-left:6px solid var(--mc,var(--brand));border-radius:0 10px 10px 0;padding:10px 18px;margin-bottom:18px;font-size:14.5px;line-height:1.4}
.exambar .k{color:var(--muted);font-weight:800}
.exambar .v{color:var(--ink2);font-weight:800}
.exambar .e{color:var(--mc);font-weight:800}
.exambar .f{font-weight:900}
.exambar .f.hi{color:var(--accent)}
.exambar .f.mid{color:var(--gold)}
.exchip{margin-left:auto;font-size:13px;font-weight:800;color:var(--mc);background:#eef3f9;border-radius:99px;padding:5px 14px}

@media print{
  body{overflow:visible;background:#fff}
  #viewport{position:static;display:block;background:#fff}
  #stage{width:100%;height:auto;transform:none!important}
  .slide{position:relative;inset:auto;opacity:1;visibility:visible;page-break-after:always;border-radius:0;height:720px;width:1280px;transform-origin:top left}
  #hud,#ctrl,#notes,#overview{display:none!important}
  .oper .opanel.steps.hide ul{filter:none;opacity:1}
}
</style>
</head>
<body>
<div id="orgbar">大连财经学院 · 计算机国家二级考试（WPS 类）校内教学辅助资料 ｜ 非官方考试网站</div>
<div id="viewport"><deck-stage id="stage"></deck-stage></div>

<div id="hud"><i></i></div>
<div id="ctrl">
  <button id="btnOv" title="幻灯片总览 (O)">总览</button>
  <button id="btnNote" title="讲稿 (N)">讲稿</button>
  <button id="btnPrev" title="上一页 (←)">‹</button>
  <span class="cnt" id="cnt">1 / 1</span>
  <button id="btnNext" title="下一页 (→)">›</button>
  <button id="btnFull" title="全屏 (F)">全屏</button>
</div>
<div id="notes"></div>
<div id="overview"><div class="og-title">幻灯片总览 · 点击跳转（橙=次课分隔，绿=课堂练习）</div><div class="og" id="ogGrid"></div></div>

<script src="./assets/curriculum.js"></script>
<script>
(function(){
  const C = window.CURRICULUM;
  const SE = C.sessions || [];
  const S = [];   // slide descriptors

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
  const L = ['A','B','C','D'];

  // 考纲标注条：对应考纲条目 + 题型分值 + 考频
  function exambar(ls){
    const fc = ls.freq==='高频' ? 'hi' : 'mid';
    return '<div class="exambar">'+
      '<span><span class="k">对应考纲：</span><span class="v">'+esc(ls.syl||'')+'</span></span>'+
      '<span><span class="k">题型分值：</span><span class="e">'+esc(ls.exam||'')+' · '+esc(ls.score||'')+'</span></span>'+
      '<span><span class="k">考频：</span><span class="f '+fc+'">'+esc(ls.freq||'')+'</span></span>'+
      '</div>';
  }

  // 课时索引：no -> {m, ls}
  const lessonMap = {};
  C.modules.forEach(function(m){ m.lessons.forEach(function(ls){ lessonMap[ls.no] = {m:m, ls:ls}; }); });

  // 1. 封面
  S.push({type:'cover', label:'封面'});

  // 2. 课程总览（11 次课）
  S.push({type:'overview', label:'课程总览'});

  // 2.1 考试说明与得分策略
  S.push({type:'exam', label:'考试说明与得分策略'});

  // 2.2 五大模块 · 课时按考试分值配置
  S.push({type:'modules', label:'五大模块 · 课时按分值配置'});

  // 3. 11 次课：次课分隔 → 课时页/内容页 → 课堂练习
  SE.forEach(function(se){
    const first = lessonMap[se.lessons[0]];
    se._color = first ? first.m.color : 'var(--brand)';
    se._mod = first ? first.m : null;
    S.push({type:'session', se:se, label:'第 '+se.no+' 次课 · '+se.name});

    se.lessons.forEach(function(no){
      const x = lessonMap[no]; if(!x) return;
      S.push({type:'lesson', mod:x.m, ls:x.ls, label:'第'+x.ls.no+'课时 · '+x.ls.title});
      x.ls.slides.forEach(function(sl){
        S.push({type:'content', mod:x.m, ls:x.ls, sl:sl, label:sl.t});
      });
    });

    S.push({type:'practice-intro', se:se, label:'课堂练习安排（第 '+se.no+' 次课）'});
    const ch = se.practice.filter(function(p){return p.type==='choice'});
    const op = se.practice.filter(function(p){return p.type==='oper'});
    const G = 3;
    for(let i=0;i<ch.length;i+=G){
      const grp = ch.slice(i, i+G);
      S.push({type:'quiz', se:se, items:grp, from:i, label:'单选练习 '+(i+1)+'–'+(i+grp.length)});
      S.push({type:'qans', se:se, items:grp, from:i, label:'答案与解析 '+(i+1)+'–'+(i+grp.length)});
    }
    op.forEach(function(o){ S.push({type:'oper', se:se, op:o, label:'操作题 · '+o.tag}); });
  });

  // 4. 结尾
  S.push({type:'end', label:'结束'});

  // ---------- 渲染 ----------
  const stage = document.getElementById('stage');
  const frag = document.createDocumentFragment();

  S.forEach(function(s,i){
    const el = document.createElement('section');
    el.className = 'slide';
    el.dataset.label = s.label;
    el.dataset.idx = i;
    const mc = s.mod ? s.mod.color : (s.se ? s.se._color : 'var(--brand)');
    el.style.setProperty('--mc', mc);

    if(s.type==='cover'){
      el.classList.add('cover');
      el.innerHTML =
        '<div class="eyebrow">大连财经学院 · 计算机国家二级考试（WPS 类）</div>'+
        '<h1>大连财经学院<br>计算机国家二级考试（WPS 类）<br>11 次课 · 44 课时通关培训</h1>'+
        '<div class="lead">依据《'+esc(C.meta.official)+'》编写 · 5 大模块按考试分值配置课时 · 每次课 4 课时，其中课堂练习占 60% · 覆盖单项选择题、文字文档、电子表格、演示文稿全部题型</div>'+
        '<div class="stats">'+
          '<div class="stat"><b>'+C.meta.code.replace('科目代码 ','')+'</b><span>科目代码</span></div>'+
          '<div class="stat"><b>5</b><span>大模块</span></div>'+
          '<div class="stat"><b>44</b><span>课时</span></div>'+
          '<div class="stat"><b>'+C.meta.duration.replace(' 分钟','')+'</b><span>分钟 / 场</span></div>'+
        '</div>'+
        '<div class="badge-line">满分 '+C.meta.full+' · '+C.meta.pass+' · 上机考试 · 讲授 40% + 课堂练习 60% · 以帮助学生通过为第一原则<br><b style="color:#ffd79a">本站为大连财经学院校内教学辅助资料，非官方考试网站，不提供报名、缴费、查分服务，不收集个人信息</b></div>';
      el._note = '开场说明课程节奏：11 次课、每次 4 课时，其中约 60% 时间用于课堂练习，强调"以练促会、当堂过关"。';
    }
    else if(s.type==='overview'){
      let cards='';
      SE.forEach(function(se){
        const mod=se._mod?se._mod.short:'';
        cards+='<div class="ov-card" style="--mc:'+se._color+'"><div class="n">第 '+se.no+' 次课 · '+se.lessons.length+' 课时</div><h3>'+esc(se.name)+'</h3><p>'+esc(se.theme)+'</p><div class="hrs">'+esc(mod)+' · 第 '+se.lessons[0]+'–'+se.lessons[se.lessons.length-1]+' 课时</div></div>';
      });
      let strip='';
      C.meta.scoring.forEach(function(x){
        strip+='<div class="sc"><b>'+x.score+'</b><span>'+esc(x.name.replace('WPS 处理','').replace('操作题',''))+'</span></div>';
      });
      el.innerHTML =
        '<div class="s-head"><span class="modtag" style="--mc:var(--brand)">课程总览</span><span class="lno">11 次课 × 4 课时 = 44 课时 · 5 大模块</span></div>'+
        '<div class="s-body"><h2 class="s-title" style="font-size:36px">课程总览与考试全景</h2><div class="rule" style="margin-bottom:16px"></div>'+
        '<div class="ov-grid s11">'+cards+'</div>'+
        '<div class="score-strip">'+strip+'</div></div>';
      el._note = '按 11 次课推进，每次课覆盖 4 课时：先集中讲授（约 40%），再大量课堂练习（约 60%）。分值最高的是表格与文字操作题（各 30 分），练习时间要重点倾斜。';
    }
    else if(s.type==='exam'){
      const pal=['#2563eb','#0891b2','#e8503a','#16a34a','#6b7a90'];
      const tmin=(C.meta.timePlan||[]).reduce(function(a,t){return a+t.minutes},0)||1;
      let sc='';
      C.meta.scoring.forEach(function(x){
        sc+='<div class="sc"><b>'+x.score+' 分</b><div class="nm">'+esc(x.name)+'</div><div class="dt">'+esc(x.detail)+'</div></div>';
      });
      let bar='';
      (C.meta.timePlan||[]).forEach(function(t,i){
        bar+='<i style="width:'+(t.minutes/tmin*100)+'%;background:'+pal[i%pal.length]+'">'+esc(t.name)+' '+t.minutes+"'</i>";
      });
      let plan='';
      (C.meta.timePlan||[]).forEach(function(t){
        plan+='<div><b>'+esc(t.name)+'：'+t.minutes+' 分钟</b>　<span class="m">'+esc(t.tip)+'</span></div>';
      });
      el.classList.add('exam');
      el.innerHTML =
        '<div class="s-head"><span class="modtag" style="--mc:var(--accent)">考试说明</span><span class="lno">满分 '+esc(C.meta.full)+' · '+esc(C.meta.duration)+' · '+esc(C.meta.mode)+' · '+esc(C.meta.env)+'</span></div>'+
        '<div class="s-body">'+
          '<h2 class="s-title" style="font-size:36px">考试说明与得分策略</h2><div class="rule" style="margin-bottom:14px"></div>'+
          '<h3 class="sec" style="margin-top:0">一、题型与分值</h3>'+
          '<div class="scoring">'+sc+'</div>'+
          '<h3 class="sec">二、120 分钟时间分配建议</h3>'+
          '<div class="tbar">'+bar+'</div>'+
          '<div class="tplan">'+plan+'</div>'+
          '<div class="goal"><b>通关目标：</b>'+esc(C.meta.passTarget)+'。操作题占 80 分，是通关关键；单选务必拿到 12 分以上。</div>'+
        '</div>';
      el._note = '先讲清考试怎么考、分值怎么分布、时间怎么分配。让学生明确"操作题优先、单选保底"的答题策略，再进入具体内容。';
    }
    else if(s.type==='modules'){
      let rows='';
      C.modules.forEach(function(m){
        rows+='<div class="mrow" style="--mc:'+m.color+'">'+
          '<div class="mn"><em>'+m.id+'</em>'+esc(m.name)+'<small>第 '+m.lessons[0].no+'–'+m.lessons[m.lessons.length-1].no+' 课时</small></div>'+
          '<div class="mh">'+m.hours+' 课时</div>'+
          '<div class="ms">'+esc(m.score||'')+'</div>'+
          '<div class="my">'+esc(m.syl||'')+'</div></div>';
      });
      el.classList.add('modules');
      el.innerHTML =
        '<div class="s-head"><span class="modtag" style="--mc:var(--brand)">模块与分值</span><span class="lno">课时按考试分值配置 · 把课时集中到最能提分的操作题</span></div>'+
        '<div class="s-body">'+
          '<h2 class="s-title" style="font-size:36px">五大模块 · 课时按考试分值配置</h2><div class="rule" style="margin-bottom:14px"></div>'+
          '<div class="mtab"><div class="mhd"><div>模块</div><div style="text-align:center">课时</div><div style="text-align:center">对应题型与分值</div><div>对应考纲条目</div></div>'+rows+'</div>'+
          '<div class="mtotal"><b>合计</b>　5 大模块 · 44 课时　｜　单选 20 + 文字 30 + 表格 30 + 演示 20 = 100 分</div>'+
        '</div>';
      el._note = '课时不是平均分配的：文字、表格各 30 分，因此各排 12 课时；单选与演示各 20 分，各排 8 课时；最后留 4 课时做全真模拟冲刺。';
    }
    else if(s.type==='session'){
      const se=s.se;
      el.classList.add('session');
      el.innerHTML =
        '<div class="sno">第 '+se.no+' 次课 / 共 11 次课</div>'+
        '<h2>'+esc(se.name)+'</h2>'+
        '<div class="theme">'+esc(se.theme)+'</div>'+
        '<div class="dmeta"><span>4 课时 · 180 分钟</span><span>第 '+se.lessons[0]+'–'+se.lessons[se.lessons.length-1]+' 课时</span><span>题型：'+esc(se.examType||'')+' · '+esc(se.score||'')+'</span></div>'+
        '<div class="ratio"><i class="t">讲授 40%</i><i class="p">课堂练习 60%</i></div>'+
        '<div class="focusline">提分重点：'+esc(se.focus||'')+'</div>'+
        '<div class="goals">'+se.goals.map(function(g){return '<div>'+esc(g)+'</div>'}).join('')+'</div>';
      el._note = '本次课目标如上，对应题型为'+esc(se.examType||'')+'（'+esc(se.score||'')+'）。讲授环节控制在约 72 分钟，其余约 108 分钟全部用于课堂练习，务必让学生当堂动手。';
    }
    else if(s.type==='lesson'){
      const ls=s.ls,m=s.mod;
      el.classList.add('lesson');
      el.innerHTML =
        '<div class="s-head"><span class="modtag">'+m.short+'</span><span class="lno">第 '+ls.no+' 课时 / 共 44 课时</span></div>'+
        '<div class="s-body">'+
          exambar(ls)+
          '<div class="huge">'+esc(ls.title)+'</div>'+
          '<div class="lobj mt" style="margin-top:26px">'+
            '<div class="lpanel k"><h4>教学目标</h4><ul>'+ls.obj.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul></div>'+
            '<div class="lpanel d"><h4>重点难点</h4><ul>'+ls.diff.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul></div>'+
          '</div>'+
        '</div>'+
        '<div class="s-foot"><span>'+esc(m.name)+'</span><span>'+C.meta.title+'</span></div>';
      el._note = '本课时约 20 分钟讲授，讲完立即进入随堂练习，做到"讲一点、练一点"。';
    }
    else if(s.type==='content'){
      const sl=s.sl,m=s.mod,ls=s.ls;
      el.innerHTML =
        '<div class="s-head"><span class="modtag">'+m.short+'</span><span class="lno">第 '+ls.no+' 课时 · '+esc(ls.title)+'</span><span class="exchip">'+esc(ls.exam||'')+' · '+esc(ls.score||'')+' · '+esc(ls.freq||'')+'</span></div>'+
        '<div class="s-body">'+
          exambar(ls)+
          '<h2 class="s-title">'+esc(sl.t)+'</h2>'+
          (sl.sub?'<div class="s-sub">'+esc(sl.sub)+'</div>':'')+
          '<div class="rule"></div>'+
          '<ul class="b">'+sl.b.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul>'+
        '</div>'+
        '<div class="s-foot"><span>'+esc(m.name)+'</span><span>对应考纲：'+esc(ls.syl||'')+'</span></div>';
      el._note = sl.n||'';
    }
    else if(s.type==='practice-intro'){
      const se=s.se;
      const chN=se.practice.filter(function(p){return p.type==='choice'}).length;
      const opN=se.practice.filter(function(p){return p.type==='oper'}).length;
      const tags=[]; se.practice.forEach(function(p){ if(tags.indexOf(p.tag)<0) tags.push(p.tag); });
      el.classList.add('pintro');
      el.innerHTML =
        '<div class="s-head"><span class="modtag">课堂练习</span><span class="lno">第 '+se.no+' 次课 · 占总课时 60%</span></div>'+
        '<div class="s-body"><h2 class="s-title" style="font-size:38px">课堂练习安排</h2>'+
        '<div class="s-sub">每次课 4 课时（180 分钟）中，约 108 分钟用于课堂练习；练完即讲评，当堂消化。</div>'+
        '<div class="rule"></div>'+
        '<div class="pgrid">'+
          '<div class="pc"><b>'+chN+'</b><span>单项选择题（与真题题型一致）</span></div>'+
          '<div class="pc"><b>'+opN+'</b><span>上机操作题（在 WPS 中真实完成）</span></div>'+
          '<div class="pc"><b>108</b><span>练习分钟数（60%）</span></div>'+
        '</div>'+
        '<div class="tags">'+tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
        '<div class="note">推荐节奏：教师示范 1 题 → 学生独立完成 → 同桌互评 → 教师统一讲评。操作题必须在 WPS 中亲手做一遍，做完对照参考答案自查。</div>'+
        '</div>';
      el._note = '练习是本次课的主体（60% 时间）。建议先练后讲，让学生先暴露问题，再针对性讲评，效率最高。';
    }
    else if(s.type==='quiz'){
      const se=s.se;
      el.classList.add('quiz');
      el.innerHTML =
        '<div class="s-head"><span class="modtag">课堂练习 · 单项选择</span><span class="lno">第 '+se.no+' 次课 · 第 '+(s.from+1)+'–'+(s.from+s.items.length)+' 题</span></div>'+
        '<div class="s-body"><h2 class="s-title" style="font-size:32px">单项选择（先独立作答，再看下一页解析）</h2><div class="rule" style="margin-bottom:16px"></div>'+
        s.items.map(function(it,k){
          return '<div class="qitem"><div class="qh"><i>'+(s.from+k+1)+'.</i>'+esc(it.q)+'</div>'+
            '<div class="opts">'+it.opts.map(function(o,j){return '<div><b>'+L[j]+'</b>'+esc(o)+'</div>'}).join('')+'</div></div>';
        }).join('')+
        '</div>';
      el._note = '先给学生 2–3 分钟独立作答，再进入下一页对答案。答错的题要求当场标记，纳入错题本。';
    }
    else if(s.type==='qans'){
      const se=s.se;
      el.classList.add('qans');
      el.innerHTML =
        '<div class="s-head"><span class="modtag">答案与解析</span><span class="lno">第 '+se.no+' 次课 · 第 '+(s.from+1)+'–'+(s.from+s.items.length)+' 题</span></div>'+
        '<div class="s-body"><h2 class="s-title" style="font-size:32px">答案与解析</h2><div class="rule" style="margin-bottom:16px"></div>'+
        s.items.map(function(it,k){
          return '<div class="aitem"><div class="top">第 '+(s.from+k+1)+' 题　<em>正确答案：'+L[it.ans]+'</em><span>'+esc(it.tag)+'</span></div>'+
            '<div class="exp">'+esc(it.exp)+'</div></div>';
        }).join('')+
        '</div>';
      el._note = '逐题讲评，重点讲清"为什么错"，把易混点写在黑板上对比，加深记忆。';
    }
    else if(s.type==='oper'){
      const se=s.se, o=s.op;
      el.classList.add('oper');
      el.innerHTML =
        '<div class="s-head"><span class="modtag">课堂练习 · 操作题</span><span class="lno">第 '+se.no+' 次课 · '+esc(o.tag)+'</span></div>'+
        '<div class="s-body"><h2 class="s-title" style="font-size:30px">上机操作题</h2><div class="rule" style="margin-bottom:14px"></div>'+
        '<div class="ocols">'+
          '<div class="opanel"><h4>题目描述</h4><p>'+esc(o.q)+'</p>'+
            '<h4 style="margin-top:18px">操作要求</h4><ul>'+o.req.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul></div>'+
          '<div class="opanel steps hide" data-steps><div class="tip">▸ 请先独立操作，再点击本区域查看参考步骤</div><h4>参考操作步骤</h4><ul>'+o.steps.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div>'+
        '</div></div>';
      el._note = '先让学生在 WPS 中独立完成（限时），完成后点击右侧区域显示参考步骤，对照自查并记录遗漏步骤。';
    }
    else if(s.type==='end'){
      el.classList.add('end');
      el.innerHTML='<h2>祝 你 通 关</h2><p>11 次课 × 4 课时 · 讲练结合 · 一次通过二级 WPS Office</p>';
      el._note = '结课提醒：考前用《考试模拟系统》完成 2 套全真模拟，把错题本清空再上考场。';
    }
    frag.appendChild(el);
  });
  stage.appendChild(frag);

  const slides = Array.from(stage.querySelectorAll('.slide'));
  const notesEl = document.getElementById('notes');
  const cntEl = document.getElementById('cnt');
  const barEl = document.querySelector('#hud i');
  const ogGrid = document.getElementById('ogGrid');
  const ovEl = document.getElementById('overview');
  let cur = 0;

  // 操作题：点击显示参考步骤
  stage.querySelectorAll('[data-steps]').forEach(function(p){
    p.addEventListener('click', function(){ p.classList.toggle('hide'); });
  });

  // 总览
  slides.forEach(function(el,i){
    const d=document.createElement('div');d.className='oc';
    if(el.classList.contains('session')) d.classList.add('sec');
    if(el.classList.contains('pintro')||el.classList.contains('quiz')||el.classList.contains('qans')||el.classList.contains('oper')) d.classList.add('pra');
    d.innerHTML='<div class="t">'+(i+1)+'. '+esc(el.dataset.label||'')+'</div>';
    d.onclick=function(){go(i);ovEl.classList.remove('on')};
    ogGrid.appendChild(d);
  });

  function go(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    slides[cur].classList.remove('active');
    cur=n;
    slides[cur].classList.add('active');
    cntEl.textContent=(cur+1)+' / '+slides.length;
    barEl.style.width=((cur+1)/slides.length*100)+'%';
    notesEl.innerHTML = slides[cur]._note ? '<b>讲稿：</b>'+esc(slides[cur]._note) : '<b>讲稿：</b>（本页无讲稿）';
    location.hash = 's'+(cur+1);
  }

  // 缩放
  function resize(){
    const s=Math.min(window.innerWidth/1280, window.innerHeight/720)*0.96;
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',resize);resize();

  // 键盘
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'||e.key==='PageDown'){e.preventDefault();go(cur+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
    else if(e.key==='Home'){go(0)} else if(e.key==='End'){go(slides.length-1)}
    else if(e.key==='f'||e.key==='F'){toggleFull()}
    else if(e.key==='n'||e.key==='N'){notesEl.classList.toggle('on')}
    else if(e.key==='o'||e.key==='O'){ovEl.classList.toggle('on')}
    else if(e.key==='Escape'){ovEl.classList.remove('on')}
  });
  function toggleFull(){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()} else {document.exitFullscreen&&document.exitFullscreen()} }
  document.getElementById('btnNext').onclick=function(){go(cur+1)};
  document.getElementById('btnPrev').onclick=function(){go(cur-1)};
  document.getElementById('btnFull').onclick=toggleFull;
  document.getElementById('btnNote').onclick=function(){notesEl.classList.toggle('on')};
  document.getElementById('btnOv').onclick=function(){ovEl.classList.toggle('on')};

  // 初始
  const m=location.hash.match(/^#s(\d+)$/);
  go(m?parseInt(m[1],10)-1:0);
  window.__deck = {go:go,total:slides.length};
})();
</script>
</body>
</html>
