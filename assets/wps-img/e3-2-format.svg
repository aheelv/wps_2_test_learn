/><text x="560.0" y="90.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.0" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text><text x="60.0" y="142.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5A6169" text-anchor="start" opacity="1">替换为</text><rect x="140.0" y="126.0" width="420.0" height="28.0" rx="3" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="148.0" y="144.3" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.0" font-weight="400" fill="#1F2329" text-anchor="left" opacity="1"></text><text x="150.0" y="145.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.0" font-weight="600" fill="#2563EB" text-anchor="start" opacity="1">格式：蓝色、不加粗</text><rect x="136.0" y="122.0" width="428.0" height="36.0" rx="6" fill="none" stroke="#E8503A" stroke-width="2.2" stroke-dasharray="6 4"/><circle cx="560.0" cy="124.0" r="11.0" fill="#E8503A" stroke="#FFFFFF" stroke-width="2"/><text x="560.0" y="128.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.0" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text><rect x="60.0" y="176.0" width="300.0" height="30.0" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="210.0" y="196.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="middle" opacity="1">查找下一处</text><rect x="170.0" y="176.0" width="300.0" height="30.0" rx="4" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1"/><text x="320.0" y="196.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#1F2329" text-anchor="middle" opacity="1">全部替换</text><rect x="166.0" y="172.0" width="308.0" height="38.0" rx="6" fill="none" stroke="#E8503A" stroke-width="2.2" stroke-dasharray="6 4"/><circle cx="480.0" cy="174.0" r="11.0" fill="#E8503A" stroke="#FFFFFF" stroke-width="2"/><text x="480.0" y="178.5" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.0" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><line x1="40.0" y1="230.0" x2="800.0" y2="230.0" stroke="#E9ECEF" stroke-width="1"/><text x="60.0" y="258.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="700" fill="#1F2329" text-anchor="start" opacity="1">格式替换要点</text><text x="70.0" y="286.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5A6169" text-anchor="start" opacity="1">· 查找条件与替换条件必须分别设置，只设一端看不出变化</text><text x="70.0" y="312.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5A6169" text-anchor="start" opacity="1">· 设完格式后先点「查找下一处」确认命中，再点「全部替换」</text><text x="70.0" y="338.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="12.5" font-weight="400" fill="#5A6169" text-anchor="start" opacity="1">· 做文本替换前先点「不限定格式」清掉残留的格式条件</text><rect x="714.4" y="480.0" width="165.6" height="20.0" rx="0" fill="#FFFFFF" stroke="#DFE3E8" stroke-width="1" opacity="0.95"/><text x="797.2" y="495.0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Source Han Sans SC, sans-serif" font-size="11.0" font-weight="400" fill="#9AA0A6" text-anchor="middle" opacity="1">界面示意图 · WPS 文字 12.x</text></svg>